<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeetCode Sync — UI Preview</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--f:'Inter',system-ui,sans-serif;--r:12px;--rs:8px;--rl:16px}
body{font-family:var(--f);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s;min-height:100vh;line-height:1.5;padding:24px}
button{border:none;cursor:pointer;font-family:var(--f);font-size:inherit}
input,textarea,select{font-family:var(--f);font-size:inherit}
.hidden{display:none!important}

/* Toggle */
.toggle-bar{display:flex;gap:8px;align-items:center;margin-bottom:24px;flex-wrap:wrap}
.toggle-bar button{padding:6px 14px;border-radius:8px;font-size:11px;font-weight:600}
.demo-label{font-size:10px;font-weight:600;opacity:.6;text-transform:uppercase;letter-spacing:.06em;margin-right:8px}
.mode-toggle{display:flex;gap:4px;padding:3px;border-radius:10px}
.step-toggle{display:flex;gap:4px;padding:3px;border-radius:10px}

/* Preview grid */
.preview-grid{display:flex;gap:24px;flex-wrap:wrap}
.preview-col{flex:1;min-width:380px;max-width:520px}

/* Theme wrapper */
.preview{font-family:var(--f);border-radius:14px;overflow:hidden;position:relative}
.preview .app{max-width:100%;margin:0;padding:20px}
.preview .empty-note{text-align:center;padding:20px;font-size:11px;opacity:.4;font-style:italic}

/* === Light theme (default in .preview) === */
.preview{background:#faf9f7;color:#1c1c1e}
.preview .tp{background:#eae7e2}
.tp{display:flex;gap:4px;padding:3px;border-radius:10px;width:fit-content;margin-left:auto;margin-bottom:12px}
.tp-btn{width:30px;height:30px;border-radius:7px;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .15s;background:transparent;color:#75644e}
.tp-btn.active{background:#fff;color:#1c1c1e;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.preview .bdg{background:#ece8e2;color:#75644e}
.preview .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.preview .hd h1{font-size:17px;font-weight:650;display:flex;align-items:center;gap:6px}
.bdg{font-size:10px;font-weight:600;padding:2px 8px;border-radius:8px;text-transform:uppercase;letter-spacing:.03em}
.preview .date{font-size:11px;opacity:.5}
.preview .st{display:flex;gap:6px;margin-bottom:16px}
.preview .sc{flex:1;padding:10px 12px;border-radius:var(--rs);min-width:0;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.preview .sc .n{font-size:18px;font-weight:700;line-height:1.2}
.preview .sc:nth-child(1) .n{color:#2563eb}
.preview .sc:nth-child(2) .n{color:#d97706}
.preview .sc:nth-child(3) .n{color:#059669}
.preview .sc:nth-child(4) .n{color:#7c3aed}
.preview .sc .l{font-size:10px;opacity:.55;margin-top:1px}
.preview .tb{display:flex;gap:2px;margin-bottom:12px;background:#eae7e2;padding:2px;border-radius:8px}
.preview .tb-btn{flex:1;padding:6px 0;text-align:center;font-size:11px;font-weight:600;border-radius:6px;transition:all .15s;background:transparent;color:#75644e}
.preview .tb-btn.active{background:#fff;color:#1c1c1e;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.preview .tb-btn.new-btn{flex:0 0 auto;padding:6px 12px;margin-left:auto;border-radius:12px;font-size:10px;background:#1c1c1e;color:#fff}
.preview .tbc{display:inline-block;font-size:9px;padding:0 5px;border-radius:6px;margin-left:3px;font-weight:700;background:rgba(0,0,0,.08);color:inherit}

/* Form styling (shared) */
.form{padding:0}
.form h2{font-size:16px;font-weight:600;margin-bottom:16px}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:11px;font-weight:600;margin-bottom:4px;opacity:.7}
.fg input,.fg textarea,.fg select{width:100%;padding:8px 10px;border-radius:var(--rs);outline:none;transition:border-color .2s;font-size:13px}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Light form fields */
.preview .fg input,.preview .fg textarea,.preview .fg select{background:#fff;border:1px solid #e0ddd8;color:#1c1c1e}
.preview .fg input:focus,.preview .fg textarea:focus{border-color:#1c1c1e}

/* LeetCode URL row */
.lc-row{display:flex;gap:6px;margin-bottom:12px;align-items:flex-start}
.lc-row .fg{flex:1;margin-bottom:0}
.lc-fetch-btn{padding:8px 14px;border-radius:var(--rs);font-size:12px;font-weight:600;height:37px;white-space:nowrap;flex-shrink:0;margin-top:18px;display:flex;align-items:center;gap:4px}
.lc-spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Fetch state badges */
.lc-state{padding:6px 10px;border-radius:6px;font-size:11px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.lc-state.success{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
.lc-state.error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.lc-state.loading{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}

/* Duplicate warning */
.lc-dupe{margin-bottom:12px;padding:10px 14px;border-radius:var(--rs);font-size:12px;background:#fefce8;border:1px solid #fde68a;color:#92400e}
.lc-dupe strong{display:block;margin-bottom:2px}
.lc-dupe .lc-dupe-actions{display:flex;gap:6px;margin-top:6px}
.lc-dupe .lc-dupe-actions button{padding:4px 12px;border-radius:6px;font-size:11px;font-weight:600}
.lc-dupe .lc-dupe-cancel{background:transparent;border:1px solid #d97706;color:#92400e}
.lc-dupe .lc-dupe-ok{background:#d97706;color:#fff}

/* Auto-filled indicator */
.lc-autofill{font-size:10px;opacity:.5;margin-top:2px;display:flex;align-items:center;gap:3px}

/* Scene labels */
.scene-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;opacity:.4;margin-bottom:8px;padding-top:8px;border-top:1px dashed;opacity:.3}
.preview .scene-label{border-color:#ddd8d0}

/* === Dark theme === */
.preview.dark{background:#14141c;color:#ddd9e3}
.preview.dark .tp{background:#1c1c28}
.preview.dark .tp-btn{color:#9a94a6}
.preview.dark .tp-btn.active{background:#262636;color:#e6e2ee}
.preview.dark .bdg{background:#252533;color:#b0a8c0}
.preview.dark .sc{background:#1c1c28;border:1px solid #262636}
.preview.dark .sc .n{color:#e6e2ee}
.preview.dark .sc:nth-child(1) .n{color:#7aa2f7}
.preview.dark .sc:nth-child(2) .n{color:#e0af68}
.preview.dark .sc:nth-child(3) .n{color:#9ece6a}
.preview.dark .sc:nth-child(4) .n{color:#bb9af7}
.preview.dark .tb{background:#1c1c28}
.preview.dark .tb-btn{color:#9a94a6}
.preview.dark .tb-btn.active{background:#262636;color:#e6e2ee}
.preview.dark .tb-btn.new-btn{background:#7aa2f7;color:#0f0f16}
.preview.dark .tbc{background:rgba(255,255,255,.1);color:inherit}

.preview.dark .fg input,.preview.dark .fg textarea,.preview.dark .fg select{background:#111118;border:1px solid #262636;color:#ddd9e3}
.preview.dark .fg input:focus,.preview.dark .fg textarea:focus{border-color:#7aa2f7}

.preview.dark .lc-state.success{background:#064e3b;color:#6ee7b7;border:1px solid #065f46}
.preview.dark .lc-state.error{background:#450a0a;color:#fca5a5;border:1px solid #7f1d1d}
.preview.dark .lc-state.loading{background:#1e3a5f;color:#93c5fd;border:1px solid #1e40af}
.preview.dark .lc-dupe{background:#2d281a;color:#fde68a;border:1px solid #92400e}
.preview.dark .lc-dupe .lc-dupe-cancel{color:#fde68a;border-color:#d97706;background:transparent}
.preview.dark .lc-dupe .lc-dupe-ok{background:#d97706;color:#0f0f16}
.preview.dark .scene-label{border-color:#262636}

.btn-p{display:inline-block;padding:8px 18px;border-radius:var(--rs);font-size:12px;font-weight:600;background:#1c1c1e;color:#fff}
.preview.dark .btn-p{background:#7aa2f7;color:#0f0f16}

.btn-g{display:inline-block;padding:8px 18px;border-radius:var(--rs);font-size:12px;font-weight:600;background:transparent;color:#555;border:1px solid #e0ddd8}
.preview.dark .btn-g{color:#999;border:1px solid #262636}

/* Edit button */
.lc-row .lc-fetch-btn{background:#1c1c1e;color:#fff}
.preview.dark .lc-row .lc-fetch-btn{background:#7aa2f7;color:#0f0f16}
.lc-row .lc-fetch-btn:disabled{opacity:.5;cursor:not-allowed}

/* Checkmark icon */
.lc-check{color:#059669;font-size:14px;display:inline-block}
.preview.dark .lc-check{color:#9ece6a}

/* Responsive */
@media(max-width:860px){
  .preview-col{min-width:auto}
  .preview-grid{flex-direction:column}
}

/* Arrow indicator */
.arrow-hint{text-align:center;font-size:10px;opacity:.3;margin:12px 0 4px;display:flex;align-items:center;justify-content:center;gap:6px}
.arrow-hint span{font-size:16px}
</style>
</head>
<body>

<div class="toggle-bar">
  <span class="demo-label">Preview:</span>
  <div class="mode-toggle" id="themeToggle">
    <button class="tp-btn active" data-theme="light" onclick="setTheme('light')">☀️</button>
    <button class="tp-btn" data-theme="dark" onclick="setTheme('dark')">🌙</button>
  </div>
  <span style="opacity:.3;margin:0 4px">|</span>
  <span class="demo-label">Scene:</span>
  <div class="step-toggle" id="sceneToggle">
    <button class="tp-btn active" data-scene="1" onclick="setScene(1)">1: Before</button>
    <button class="tp-btn" data-scene="2" onclick="setScene(2)">2: Fetching</button>
    <button class="tp-btn" data-scene="3" onclick="setScene(3)">3: Fetched ✅</button>
    <button class="tp-btn" data-scene="4" onclick="setScene(4)">4: Duplicate ⚠️</button>
  </div>
</div>

<div class="preview-grid">
  <!-- Light preview -->
  <div class="preview-col">
    <div class="preview" id="previewLight">
      <div class="app" id="appLight">
        <!-- Header -->
        <div class="hd">
          <h1>✏️ Coding Journal <span class="bdg">0 due</span></h1>
          <span class="date">Jun 6, 2026</span>
        </div>
        <!-- Stats -->
        <div class="st">
          <div class="sc"><div class="n">24</div><div class="l">Total</div></div>
          <div class="sc"><div class="n">3</div><div class="l">Due</div></div>
          <div class="sc"><div class="n">12</div><div class="l">Mastered</div></div>
          <div class="sc"><div class="n">7</div><div class="l">Streak</div></div>
        </div>
        <!-- Tabs -->
        <div class="tb">
          <button class="tb-btn">Due <span class="tbc">3</span></button>
          <button class="tb-btn">All <span class="tbc">24</span></button>
          <button class="tb-btn">Mastered <span class="tbc">12</span></button>
          <button class="tb-btn new-btn active">+ New</button>
        </div>
        <!-- Dynamic form area -->
        <div id="formAreaLight"></div>
      </div>
      <div class="empty-note">Light theme</div>
    </div>
  </div>

  <!-- Dark preview -->
  <div class="preview-col">
    <div class="preview dark" id="previewDark">
      <div class="app" id="appDark">
        <!-- Header -->
        <div class="hd">
          <h1>✏️ Coding Journal <span class="bdg">0 due</span></h1>
          <span class="date">Jun 6, 2026</span>
        </div>
        <!-- Stats -->
        <div class="st">
          <div class="sc"><div class="n">24</div><div class="l">Total</div></div>
          <div class="sc"><div class="n">3</div><div class="l">Due</div></div>
          <div class="sc"><div class="n">12</div><div class="l">Mastered</div></div>
          <div class="sc"><div class="n">7</div><div class="l">Streak</div></div>
        </div>
        <!-- Tabs -->
        <div class="tb">
          <button class="tb-btn">Due <span class="tbc">3</span></button>
          <button class="tb-btn">All <span class="tbc">24</span></button>
          <button class="tb-btn">Mastered <span class="tbc">12</span></button>
          <button class="tb-btn new-btn active">+ New</button>
        </div>
        <!-- Dynamic form area -->
        <div id="formAreaDark"></div>
      </div>
      <div class="empty-note">Dark theme</div>
    </div>
  </div>
</div>

<script>
var currentScene = 1;
var currentTheme = 'light';

function setTheme(t) {
  currentTheme = t;
  document.getElementById('previewDark').style.display = t === 'dark' ? 'block' : 'block';
  // Toggle buttons
  document.querySelectorAll('#themeToggle .tp-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.theme === t);
  });
  renderScene(currentScene);
}

function setScene(n) {
  currentScene = n;
  document.querySelectorAll('#sceneToggle .tp-btn').forEach(function(b) {
    b.classList.toggle('active', parseInt(b.dataset.scene) === n);
  });
  renderScene(currentScene);
}

function esc(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function renderScene(scene) {
  var lightEl = document.getElementById('formAreaLight');
  var darkEl = document.getElementById('formAreaDark');
  
  lightEl.innerHTML = renderForm(scene, 'light');
  darkEl.innerHTML = renderForm(scene, 'dark');
}

function renderForm(scene, theme) {
  var isDark = theme === 'dark';
  var html = '';
  
  // Scene 1: Default form (before any fetch)
  if (scene === 1) {
    html = '<div class="form">' +
      '<h2>New Card</h2>' +
      '<form>' +
        // LeetCode URL row
        '<div class="lc-row">' +
          '<div class="fg">' +
            '<label>LeetCode URL</label>' +
            '<input type="url" id="fLC" placeholder="https://leetcode.com/problems/two-sum/" style="font-size:12px">' +
          '</div>' +
          '<button type="button" class="lc-fetch-btn" disabled style="opacity:.4;cursor:not-allowed">Fetch</button>' +
        '</div>' +
        '<div style="text-align:center;font-size:10px;opacity:.35;margin:-6px 0 12px">Paste a LeetCode URL, then click Fetch to auto-fill</div>' +
        // Existing form fields
        '<div class="f-row">' +
          '<div class="fg"><label>Question *</label><input type="text" id="fQ" placeholder="e.g. Two Sum" required></div>' +
          '<div class="fg"><label>Link</label><input type="url" id="fL" placeholder="https://leetcode.com/..."></div>' +
        '</div>' +
        '<div class="f-row">' +
          '<div class="fg"><label>Tags</label><input type="text" id="fT" placeholder="arrays, hash-map"></div>' +
          '<div class="fg"><label>Difficulty</label><select id="fD"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select></div>' +
        '</div>' +
        '<div class="fg"><label>What I Was Thinking *</label><textarea id="fMyT" rows="3" placeholder="Describe your approach..."></textarea></div>' +
        '<div class="fg"><label>Right Thinking *</label><textarea id="fRT" rows="3" placeholder="Describe the correct approach..."></textarea></div>' +
        '<div class="fg"><label>Code</label><textarea id="fCode" rows="5" placeholder="Paste code here..."></textarea></div>' +
        '<div class="fg"><label>Notes</label><textarea id="fNotes" rows="2" placeholder="Observations..."></textarea></div>' +
        '<button type="submit" class="btn-p" style="margin-top:4px">Save →</button>' +
      '</form></div>';
  }
  
  // Scene 2: Fetching (loading state)
  if (scene === 2) {
    html = '<div class="form">' +
      '<h2>New Card</h2>' +
      '<form>' +
        '<div class="lc-row">' +
          '<div class="fg">' +
            '<label>LeetCode URL</label>' +
            '<input type="url" id="fLC" value="https://leetcode.com/problems/two-sum/" style="font-size:12px;border-color:' + (isDark ? '#1e40af' : '#93c5fd') + '">' +
          '</div>' +
          '<button type="button" class="lc-fetch-btn" disabled style="opacity:.7"><span class="lc-spinner"></span> Fetching</button>' +
        '</div>' +
        '<div class="lc-state loading">' +
          '<span class="lc-spinner"></span> Fetching problem data from LeetCode...' +
        '</div>' +
        // Existing form fields (empty, disabled-looking)
        '<div class="f-row">' +
          '<div class="fg"><label>Question *</label><input type="text" placeholder="e.g. Two Sum" style="opacity:.5" disabled></div>' +
          '<div class="fg"><label>Link</label><input type="url" placeholder="https://leetcode.com/..." style="opacity:.5" disabled></div>' +
        '</div>' +
        '<div class="f-row">' +
          '<div class="fg"><label>Tags</label><input type="text" placeholder="arrays, hash-map" style="opacity:.5" disabled></div>' +
          '<div class="fg"><label>Difficulty</label><select disabled style="opacity:.5"></div>' +
        '</div>' +
        '<div class="fg"><label>What I Was Thinking *</label><textarea rows="3" placeholder="Describe your approach..." style="opacity:.5" disabled></textarea></div>' +
        '<div class="fg"><label>Right Thinking *</label><textarea rows="3" placeholder="Describe the correct approach..." style="opacity:.5" disabled></textarea></div>' +
        '<div class="fg"><label>Code</label><textarea rows="5" placeholder="Paste code here..." style="opacity:.5" disabled></textarea></div>' +
        '<div class="fg"><label>Notes</label><textarea rows="2" placeholder="Observations..." style="opacity:.5" disabled></textarea></div>' +
        '<button type="submit" class="btn-p" style="margin-top:4px" disabled>Save →</button>' +
      '</form></div>';
  }
  
  // Scene 3: Successfully fetched, fields auto-populated
  if (scene === 3) {
    html = '<div class="form">' +
      '<h2>New Card</h2>' +
      '<form>' +
        '<div class="lc-row">' +
          '<div class="fg">' +
            '<label>LeetCode URL</label>' +
            '<input type="url" id="fLC" value="https://leetcode.com/problems/two-sum/" style="font-size:12px;' + 
            (isDark ? 'border-color:#065f46' : 'border-color:#6ee7b7') + '">' +
          '</div>' +
          '<button type="button" class="lc-fetch-btn" disabled style="opacity:.6;background:' + (isDark ? '#1e3a5f' : '#e0e7ff') + ';color:' + (isDark ? '#93c5fd' : '#1e40af') + '">✅ Done</button>' +
        '</div>' +
        '<div class="lc-state success">✅ Fetched: Two Sum — Easy</div>' +
        // Auto-filled fields (with indicators)
        '<div class="f-row">' +
          '<div class="fg"><label>Question *</label><input type="text" value="Two Sum" style="border-color:' + (isDark ? '#065f46' : '#a7f3d0') + '">' +
            '<div class="lc-autofill">↳ Auto-filled from LeetCode</div>' +
          '</div>' +
          '<div class="fg"><label>Link</label><input type="url" value="https://leetcode.com/problems/two-sum/" style="border-color:' + (isDark ? '#065f46' : '#a7f3d0') + '">' +
            '<div class="lc-autofill">↳ Auto-filled from LeetCode</div>' +
          '</div>' +
        '</div>' +
        '<div class="f-row">' +
          '<div class="fg"><label>Tags</label><input type="text" value="array, hash-table" style="border-color:' + (isDark ? '#065f46' : '#a7f3d0') + '">' +
            '<div class="lc-autofill">↳ Auto-filled from LeetCode</div>' +
          '</div>' +
          '<div class="fg"><label>Difficulty</label><select><option value="easy" selected>Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select>' +
            '<div class="lc-autofill">↳ Auto-filled from LeetCode</div>' +
          '</div>' +
        '</div>' +
        // Reminder that user fields are unaffected
        '<div style="background:' + (isDark ? '#1e3a5f' : '#eff6ff') + ';padding:8px 10px;border-radius:6px;font-size:11px;margin-bottom:12px;opacity:.7">' +
          'Your thinking notes and code below are <strong>not overwritten</strong> by the fetch.' +
        '</div>' +
        '<div class="fg"><label>What I Was Thinking *</label><textarea rows="3" placeholder="Describe your approach..."></textarea></div>' +
        '<div class="fg"><label>Right Thinking *</label><textarea rows="3" placeholder="Describe the correct approach..."></textarea></div>' +
        '<div class="fg"><label>Code</label><textarea rows="5" placeholder="Paste code here..."></textarea></div>' +
        '<div class="fg"><label>Notes</label><textarea rows="4" placeholder="Observations..." style="font-size:12px">Given an array of integers nums and an integer target, return indices of the two numbers such that they add up to target.

You may assume that each input would have exactly one solution, and you may not use the same element twice.

Example 1:
Input: nums = [2,7,11,15], target = 9
Output: [0,1]
Explanation: Because nums[0] + nums[1] == 9, we return [0, 1].

Constraints:
- 2 <= nums.length <= 10^4
- -10^9 <= nums[i] <= 10^9
- -10^9 <= target <= 10^9</textarea>' +
          '<div class="lc-autofill">↳ Problem description auto-filled in Notes</div>' +
        '</div>' +
        '<button type="submit" class="btn-p" style="margin-top:4px">Save →</button>' +
      '</form></div>';
  }
  
  // Scene 4: Duplicate warning
  if (scene === 4) {
    html = '<div class="form">' +
      '<h2>New Card</h2>' +
      '<form>' +
        '<div class="lc-row">' +
          '<div class="fg">' +
            '<label>LeetCode URL</label>' +
            '<input type="url" id="fLC" value="https://leetcode.com/problems/two-sum/" style="font-size:12px;' + 
            (isDark ? 'border-color:#92400e' : 'border-color:#fde68a') + '">' +
          '</div>' +
          '<button type="button" class="lc-fetch-btn" disabled style="opacity:.6;background:' + (isDark ? '#1e3a5f' : '#e0e7ff') + ';color:' + (isDark ? '#93c5fd' : '#1e40af') + '">✅ Done</button>' +
        '</div>' +
        '<div class="lc-state success">✅ Fetched: Two Sum — Easy</div>' +
        // Duplicate warning
        '<div class="lc-dupe">' +
